<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Board — Philippe Amouyal</title>
<script src="https://www.youtube.com/iframe_api"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ── */
:root {
  --bg:#07070e;
  --surf:#0f0f1a;
  --surf2:#171727;
  --surf3:#1e1e2e;
  --border:#252538;
  --accent:#d4ff4e;
  --accent-dim:#8faa20;
  --red:#ff3d5a;
  --teal:#00e5b0;
  --blue:#3d8bff;
  --tiktok:#ff2d55;
  --gold:#ffc83d;
  --purple:#a78bfa;
  --muted:#52526e;
  --muted2:#3a3a52;
  --text:#e8e8f5;
  --text2:#a0a0bf;
  --r: 0.375rem;
}

/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow-x:hidden}
button{cursor:pointer;font-family:inherit}

/* ── NOISE OVERLAY ── */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:.6}

/* ── HEADER ── */
header{
  padding:20px 28px 16px;
  border-bottom:1px solid var(--border);
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:16px;
}
.logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(22px,3.5vw,38px);
  letter-spacing:3px;
  line-height:1;
  color:var(--text);
}
.logo em{color:var(--accent);font-style:normal}
.logo-sub{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:3px}

.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.source-tag{
  font-family:'JetBrains Mono',monospace;font-size:9px;
  padding:3px 9px;border-radius:100px;
  border:1px solid;letter-spacing:1px;font-weight:500;
  white-space:nowrap;
}
.st-radio{border-color:var(--gold);color:var(--gold)}
.st-singles{border-color:var(--red);color:var(--red)}
.st-shazam{border-color:var(--blue);color:var(--blue)}
.st-tiktok{border-color:var(--tiktok);color:var(--tiktok)}

#btn-copy-all{
  background:var(--surf2);border:1px solid var(--border);color:var(--text2);
  padding:6px 13px;border-radius:100px;font-size:11px;font-weight:500;
  transition:all .15s;white-space:nowrap;
}
#btn-copy-all:hover{border-color:var(--teal);color:var(--teal)}
#btn-copy-all.ok{border-color:var(--teal);color:var(--teal);background:#00e5b011}

/* ── PLAYER BAR ── */
#player-bar{
  display:none;align-items:center;gap:12px;
  padding:10px 28px;
  background:#0c0c1a;
  border-bottom:2px solid var(--accent);
  position:sticky;top:0;z-index:80;
}
#player-bar.on{display:flex}
#yt-hidden{position:absolute;width:1px;height:1px;opacity:0;left:-9999px}
.pb-art{width:38px;height:38px;border-radius:4px;object-fit:cover;background:var(--surf2);flex-shrink:0}
.pb-text{flex:0 0 auto;min-width:0;max-width:170px}
.pb-t{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-a{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-top:1px}
.pb-ctrl{display:flex;gap:6px;flex-shrink:0}
.pb-c{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text);font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pb-c:hover,.pb-c.on{border-color:var(--accent);color:var(--accent)}
.pb-c.on{background:var(--accent);color:var(--bg)}
.pb-seek-row{flex:1;display:flex;align-items:center;gap:8px;min-width:80px}
.pb-time{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.pb-seek{flex:1;height:3px;border-radius:2px;background:var(--border);cursor:pointer;appearance:none;accent-color:var(--accent)}
.pb-seek::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer}
.pb-vol{width:55px;height:3px;accent-color:var(--teal);cursor:pointer;flex-shrink:0}
.pb-x{background:none;border:none;color:var(--muted);font-size:18px;padding:0 2px;transition:color .15s;flex-shrink:0}
.pb-x:hover{color:var(--red)}

/* ── TABS ── */
nav.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surf);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.ntab{
  padding:12px 20px;font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.5px;
  color:var(--muted);border-bottom:2px solid transparent;
  white-space:nowrap;background:none;border-left:none;border-right:none;border-top:none;
  transition:all .15s;
}
.ntab:hover{color:var(--text)}
.ntab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* ── PANELS ── */
.panel{display:none}
.panel.on{display:block}

/* ── FILTERS ── */
.filter-bar{
  padding:10px 28px;display:flex;gap:6px;
  flex-wrap:wrap;align-items:center;
  border-bottom:1px solid var(--border);background:#0a0a15;
}
.fl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-right:2px}
.fchip{
  padding:4px 11px;border-radius:100px;
  border:1px solid var(--border);background:transparent;
  color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;
  transition:all .15s;letter-spacing:.5px;
}
.fchip:hover{border-color:var(--accent);color:var(--accent)}
.fchip.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}

/* ── VIEW TOGGLE ── */
.view-toggle{display:flex;gap:4px;margin-left:auto}
.vtbtn{
  background:none;border:1px solid var(--border);color:var(--muted);
  padding:3px 9px;border-radius:100px;font-size:11px;
  transition:all .15s;
}
.vtbtn.on{border-color:var(--accent);color:var(--accent)}

/* ══════════════════════════════
   TABLE VIEW
══════════════════════════════ */
.table-wrap{padding:0 0 60px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:860px}
thead tr{border-bottom:1px solid var(--border)}
th{
  padding:10px 12px;font-family:'JetBrains Mono',monospace;
  font-size:8px;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);text-align:left;font-weight:400;
  white-space:nowrap;cursor:pointer;transition:color .15s;
}
th:hover{color:var(--text)}
th.sa{color:var(--accent)!important}
th.tc{text-align:center}

tbody tr{border-bottom:1px solid #0d0d1a;transition:background .1s}
tbody tr:hover{background:var(--surf)}
tbody tr.now-playing{background:#0d130a!important;border-left:3px solid var(--accent)}

td{padding:9px 12px;font-size:12px;vertical-align:middle}

/* Rank number */
.rn{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted2);text-align:center;display:block;line-height:1}
.rn.top{color:var(--accent)}

/* Play button */
.play-btn{
  width:30px;height:30px;border-radius:50%;
  border:1px solid var(--border);background:transparent;
  color:var(--muted);font-size:10px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;margin:0 auto;
}
.play-btn:hover{border-color:var(--accent);color:var(--accent);background:#d4ff4e11}
.play-btn.on{border-color:var(--accent);color:var(--bg);background:var(--accent)}

/* Copy button */
.cp-btn{
  background:none;border:1px solid var(--border);color:var(--muted);
  padding:2px 6px;border-radius:100px;font-size:9px;
  transition:all .15s;white-space:nowrap;
}
.cp-btn:hover{border-color:var(--teal);color:var(--teal)}
.cp-btn.ok{border-color:var(--teal);color:var(--teal);background:#00e5b011}

/* Track cell */
.tname{font-weight:600;font-size:12px;line-height:1.2}
.tartist{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-top:2px}
.tbadge{display:inline-flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:8px;padding:1px 5px;border-radius:100px;margin-left:4px;border:1px solid}
.b-streak{border-color:var(--gold);color:var(--gold)}
.b-multi{border-color:var(--teal);color:var(--teal)}

/* Rank values */
.rv{font-family:'JetBrains Mono',monospace;font-size:11px;display:inline-block;min-width:28px;text-align:right}
.rn0{color:var(--muted2)}
.tu{color:var(--teal);font-size:8px}
.td2{color:var(--red);font-size:8px}

/* Camelot */
.cam{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:34px;height:20px;border-radius:4px;
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:500;
  border:1px solid var(--purple);color:var(--purple);background:#a78bfa11;
  letter-spacing:.5px;padding:0 4px;
}

/* Moment */
.mo{display:inline-flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:8px;padding:2px 6px;border-radius:100px;border:1px solid;white-space:nowrap;margin:1px}
.mo-c{border-color:#60a5fa;color:#60a5fa}
.mo-d{border-color:#fb923c;color:#fb923c}
.mo-df{border-color:var(--accent);color:var(--accent)}
.mo-s{border-color:var(--red);color:var(--red)}
.mo-f{border-color:var(--teal);color:var(--teal)}

/* Stars */
.stars{font-size:10px;letter-spacing:1px}

/* Score */
.sc-wrap{display:flex;align-items:center;gap:6px}
.sc-bar{height:3px;flex:1;background:var(--border);border-radius:2px;overflow:hidden;max-width:44px}
.sc-fill{height:100%;border-radius:2px;transition:width .4s ease}
.sc-n{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;min-width:22px}

/* Grade */
.grade{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:4px;
  font-family:'Bebas Neue',sans-serif;font-size:14px;border:1.5px solid;
}

/* Grade + score colors */
.gS,.sS{color:#f0abfc}.fS{background:#f0abfc}.gS{border-color:#f0abfc;background:#f0abfc11}
.gA,.sA{color:var(--accent)}.fA{background:var(--accent)}.gA{border-color:var(--accent);background:#d4ff4e11}
.gB,.sB{color:var(--gold)}.fB{background:var(--gold)}.gB{border-color:var(--gold);background:#ffc83d11}
.gC,.sC{color:var(--teal)}.fC{background:var(--teal)}.gC{border-color:var(--teal);background:#00e5b011}
.gD,.sD{color:var(--muted)}.fD{background:var(--muted2)}.gD{border-color:var(--muted2)}

/* Note */
.note-btn{
  background:none;border:1px solid var(--border);color:var(--muted);
  padding:2px 8px;border-radius:100px;font-size:9px;
  transition:all .15s;white-space:nowrap;
}
.note-btn:hover{border-color:var(--gold);color:var(--gold)}
.note-btn.has-note{border-color:var(--gold);color:var(--gold);background:#ffc83d11}
.note-txt{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--gold);margin-top:2px;font-style:italic;line-height:1.3}

/* ══════════════════════════════
   CARD VIEW
══════════════════════════════ */
#card-grid{
  display:none;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:12px;
  padding:16px 20px 60px;
}
#card-grid.show{display:grid}
.card{
  background:var(--surf);border:1px solid var(--border);
  border-radius:10px;overflow:hidden;
  transition:transform .15s,border-color .15s,box-shadow .15s;
  cursor:pointer;
}
.card:hover{transform:translateY(-2px);border-color:var(--muted);box-shadow:0 8px 24px #00000044}
.card.now-playing{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)22}
.card-top{padding:14px 14px 10px;display:flex;gap:10px;align-items:flex-start}
.card-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--muted2);line-height:1;flex-shrink:0;min-width:30px}
.card-num.top{color:var(--accent)}
.card-info{flex:1;min-width:0}
.card-title{font-weight:700;font-size:14px;line-height:1.2;margin-bottom:2px}
.card-artist{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
.card-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.card-grade{
  font-family:'Bebas Neue',sans-serif;font-size:20px;
  width:36px;height:36px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid;flex-shrink:0;
}
.card-mid{padding:0 14px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-cam{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  padding:3px 9px;border-radius:100px;
  border:1px solid var(--purple);color:var(--purple);background:#a78bfa11;
}
.card-bpm{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
.card-stars{font-size:11px;letter-spacing:1px}
.card-charts{
  padding:8px 14px;background:var(--surf2);
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
}
.card-chart-item{display:flex;flex-direction:column;align-items:center;gap:2px}
.cci-label{font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:1px;text-transform:uppercase}
.cci-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500}
.card-bottom{padding:10px 14px;display:flex;gap:6px;align-items:center;border-top:1px solid var(--border)}
.card-play{
  flex:1;padding:7px;border-radius:8px;
  border:1px solid var(--border);background:transparent;
  color:var(--text2);font-size:12px;font-weight:600;
  transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;
}
.card-play:hover{border-color:var(--accent);color:var(--accent);background:#d4ff4e0a}
.card-play.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.card-cp{
  background:none;border:1px solid var(--border);color:var(--muted);
  padding:7px 10px;border-radius:8px;font-size:10px;
  transition:all .15s;
}
.card-cp:hover{border-color:var(--teal);color:var(--teal)}
.card-cp.ok{border-color:var(--teal);color:var(--teal)}
.card-note{
  background:none;border:1px solid var(--border);color:var(--muted);
  padding:7px 10px;border-radius:8px;font-size:10px;
  transition:all .15s;
}
.card-note:hover{border-color:var(--gold);color:var(--gold)}
.card-note.has{border-color:var(--gold);color:var(--gold);background:#ffc83d0a}

/* ══════════════════════════════
   SETLIST PANEL
══════════════════════════════ */
#panel-setlist{padding:20px 28px 60px}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:20px}
.cfg-box{background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:14px}
.cfg-lbl{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.cfg-sel,.cfg-range{width:100%;background:var(--surf2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11px}
.cfg-range{padding:3px 0;accent-color:var(--accent)}
.cfg-v{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-top:5px}
.btn-gen{
  background:var(--accent);color:var(--bg);border:none;
  padding:12px 32px;font-family:'Bebas Neue',sans-serif;font-size:20px;
  letter-spacing:2px;border-radius:8px;transition:opacity .15s;margin-bottom:20px;
}
.btn-gen:hover{opacity:.85}
#export-row{display:none;gap:8px;margin-bottom:16px}
#export-row.show{display:flex}
.btn-exp{
  background:var(--surf);border:1px solid var(--border);color:var(--text2);
  padding:8px 16px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:10px;
  transition:all .15s;
}
.btn-exp:hover{border-color:var(--accent);color:var(--accent)}
#setlist-out{display:none}
#setlist-out.show{display:block}
.sl-hdr{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sl-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:2px}
.sl-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
.sl-phase{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--muted);padding:10px 0 4px}
.sl-track{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-bottom:1px solid var(--border);
  background:var(--surf);transition:background .1s;
}
.sl-track:hover{background:var(--surf2)}
.sl-n{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--muted2);min-width:26px}
.sl-info{flex:1}
.sl-name{font-weight:600;font-size:13px}
.sl-artist{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted)}
.sl-tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.sl-trans{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted2);padding:4px 14px;border-bottom:1px solid var(--border)}
.btn-sl-yt{
  background:none;border:1px solid #ff334422;color:#ff6655;
  padding:5px 10px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:9px;
  transition:all .15s;
}
.btn-sl-yt:hover{border-color:#ff4444;background:#ff44440a}

/* ══════════════════════════════
   PERF MODE
══════════════════════════════ */
#panel-perf .empty{padding:40px 28px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
#perf-wrap{display:none}
#perf-now{
  background:linear-gradient(135deg,var(--surf) 0%,#0d1a0d 100%);
  border-bottom:1px solid var(--border);padding:24px 28px;
}
.perf-label{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
#perf-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,8vw,64px);letter-spacing:2px;line-height:1;color:var(--accent)}
#perf-artist{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);margin-top:4px}
.perf-tags{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.perf-tag-cam{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--purple);border:1px solid var(--purple);padding:4px 10px;border-radius:6px}
.perf-tag-bpm{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.perf-tag-mo{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
#perf-yt{background:#ff000018;border:1px solid #ff444466;color:#ff8888;padding:7px 14px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:10px;transition:all .15s}
#perf-yt:hover{background:#ff000030;border-color:#ff4444}

#perf-next-bar{
  display:flex;align-items:center;gap:12px;
  padding:12px 28px;background:#0a0a15;border-bottom:1px solid var(--border);
}
.pnb-label{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted2);flex-shrink:0}
.pnb-info{flex:1}
.pnb-title{font-weight:600;font-size:14px}
.pnb-artist{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted)}
.pnb-cam{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--purple);border:1px solid var(--purple);padding:2px 8px;border-radius:4px}
.pnb-trans{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted)}

#perf-nav{display:flex;border-bottom:1px solid var(--border)}
.pnav-btn{
  flex:1;padding:16px;background:var(--surf);border:none;
  color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:18px;
  letter-spacing:2px;transition:background .15s;
}
.pnav-btn:hover{background:var(--surf2)}
#pnav-next{background:var(--accent);color:var(--bg)}
#pnav-next:hover{opacity:.9}
#pnav-prev{border-right:1px solid var(--border)}

#perf-list{overflow-y:auto;max-height:calc(100vh - 420px)}
.perf-li{
  display:flex;align-items:center;gap:10px;
  padding:10px 28px;border-bottom:1px solid #0d0d1a;
  cursor:pointer;transition:background .1s;
}
.perf-li:hover{background:var(--surf)}
.perf-li.on{background:var(--surf2)}
.pli-n{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted2);min-width:20px}
.pli-n.on{color:var(--accent)}
.pli-title{font-weight:600;font-size:12px}
.pli-artist{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted)}
.pli-cam{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--purple);border:1px solid var(--purple);padding:1px 6px;border-radius:4px;margin-left:auto}

/* ══════════════════════════════
   NOTES PANEL
══════════════════════════════ */
#panel-notes{padding:20px 28px 60px}
.notes-empty{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.note-item{padding:14px 0;border-bottom:1px solid var(--border)}
.ni-title{font-weight:600;font-size:13px}
.ni-artist{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted)}
.ni-status{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);margin-top:5px}
.ni-edit{background:none;border:1px solid var(--gold);color:var(--gold);padding:3px 10px;border-radius:100px;font-size:9px;margin-top:6px;transition:all .15s}
.ni-edit:hover{background:#ffc83d22}

/* ══════════════════════════════
   MODAL
══════════════════════════════ */
.modal-bg{display:none;position:fixed;inset:0;background:#000b;z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:22px;width:min(380px,90vw)}
.modal h3{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;margin-bottom:12px}
.modal select,.modal textarea{
  width:100%;background:var(--surf);border:1px solid var(--border);
  color:var(--text);padding:8px;border-radius:6px;
  font-family:'JetBrains Mono',monospace;font-size:11px;margin-bottom:10px;
}
.modal textarea{height:80px;resize:vertical}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.mbtn{padding:7px 16px;border-radius:100px;font-family:'JetBrains Mono',monospace;font-size:10px;border:1px solid;transition:all .15s}
.mbtn-save{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.mbtn-cancel{background:transparent;color:var(--muted);border-color:var(--border)}
.mbtn-del{background:transparent;color:var(--red);border-color:var(--red)}

/* ══════════════════════════════
   RESPONSIVE
══════════════════════════════ */
@media(max-width:640px){
  header{grid-template-columns:1fr;gap:10px}
  .header-right{justify-content:flex-start}
  .filter-bar,.pb-seek-row{flex-wrap:wrap}
  #panel-setlist{padding:16px 16px 60px}
  #panel-notes{padding:16px 16px 60px}
  #card-grid{padding:12px 12px 60px;grid-template-columns:1fr}
  .perf-li{padding:10px 16px}
  #perf-now{padding:18px 16px}
  #perf-next-bar{padding:10px 16px}
  #pnav-btn{padding:14px}
}

/* ══════════════════════════════
   PRINT
══════════════════════════════ */
@media print{
  header,.tabs,nav,.filter-bar,#player-bar,.modal-bg,#export-row,
  #panel-charts,#panel-notes,#panel-perf,#card-grid,.btn-gen{display:none!important}
  #panel-setlist{display:block!important;padding:0!important}
  .cfg-grid{display:none!important}
  body{background:white!important;color:black!important}
  .sl-track{background:white!important;border-bottom:1px solid #ccc!important;break-inside:avoid}
  .sl-name{color:black!important}
  .sl-artist,.sl-trans{color:#555!important}
  .btn-sl-yt{display:none!important}
}

/* PLAYER BAR */
#player-bar{display:none;align-items:center;gap:12px;padding:8px 28px;background:#0c0c1a;border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:80;flex-wrap:nowrap}
#player-bar.on{display:flex}
.pb-c{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .15s;cursor:pointer}
.pb-c:hover{border-color:var(--accent);color:var(--accent)}
.pb-x{background:none;border:none;color:var(--muted);font-size:18px;padding:0 2px;cursor:pointer;flex-shrink:0}
.pb-x:hover{color:var(--red)}
/* HEART BUTTON */
.heart-btn{background:none;border:none;font-size:16px;cursor:pointer;padding:2px 4px;transition:transform .15s;line-height:1;color:var(--muted)}
.heart-btn:hover{transform:scale(1.3)}
.heart-btn.liked{color:var(--red)}

</style>

function parseTracks(arr) {
  return arr.map(d=>[
    d.title,d.artist,
    d.radio||0,d.singles||0,d.shazam||0,d.tiktok||0,
    d.tags||[],d.bpm||0,d.weeks||0,d.trend||0,
    d.youtubeId||'',d.mixte||3,d.camelot||'?',d.moments||['diner']
  ]);
}

function setMeta(u,w) {
  const el=document.querySelector('.logo-sub');
  if(el) el.textContent='Philippe Amouyal · PADJ.FR · Semaine '+w+' — Màj '+u;
}

async function loadData() {
  T=parseTracks(EMBEDDED.tracks);
  setMeta(EMBEDDED.updated,EMBEDDED.week);
  render();
  try {
    const r=await fetch('https://raw.githubusercontent.com/replay04/dj-board/main/data.json?v='+Date.now());
    if(r.ok) {
      const d=await r.json();
      if((d.week||0)>=EMBEDDED.week) {
        T=parseTracks(d.tracks);
        setMeta(d.updated,d.week);
        render();
      }
    }
  } catch(e) {}
}

// STATE
// ══════════════════════════════════════════
let sortKey='score', activeFilter='all', viewMode='table';
let notes=JSON.parse(localStorage.getItem('djb-notes')||'{}');
let modalKey=null;
let queue=[], qIdx=0;
let playingYt=null, playingBtn=null;
let playAllActive=false;

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
const $=id=>document.getElementById(id);
const trackKey=d=>d[0]+'|'+d[1];

function sc(r,s,sh,tt) {
  const rs  = r >0?Math.max(0,33-(r -1)*.55):0;
  const ss  = s >0?Math.max(0,33-(s -1)*.35):0;
  const shs = sh>0?Math.max(0,18-(sh-1)*.18):0;
  const tts = tt>0?Math.max(0,16-(tt-1)*.16):0;
  const n=[r,s,sh,tt].filter(x=>x>0).length;
  return Math.round((rs+ss+shs+tts)*(n>=3?1.12:n>=2?1.05:1));
}
function gr(v) {return v>=85?'S':v>=65?'A':v>=45?'B':v>=25?'C':'D'}
function fmtT(s) {s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function isMulti(d) {return [d[2],d[3],d[4],d[5]].filter(x=>x>0).length>=3}

const MO_CLS={cocktail:'mo-c',diner:'mo-d',dance:'mo-df',slow:'mo-s',fin:'mo-f'};
const MO_LBL={cocktail:'🥂 Cocktail',diner:'🍽 Dîner',dance:'🕺 Dance',slow:'❤️ Slow',fin:'🎉 Fin'};
const SC_COL={5:'var(--gold)',4:'var(--gold)',3:'var(--teal)',2:'var(--muted)',1:'var(--muted)'};

// ══════════════════════════════════════════
// FILTER / SORT
// ══════════════════════════════════════════
function filtered() {
  return T.filter(d=>{
    const s=sc(d[2],d[3],d[4],d[5]);
    const hasYt=d[10]&&d[10].length>3;
    const hasCam=d[12]&&d[12]!=='?';
    if(s===0&&!hasYt&&!hasCam) return false;
    const tags=d[6],mo=d[13];
    if(activeFilter==='all')       return true;
    if(activeFilter==='triple')    return isMulti(d);
    if(activeFilter==='tiktok')    return d[5]>0;
    if(activeFilter==='noted')     return !!notes[trackKey(d)];
    if(activeFilter==='mixte5')    return d[11]>=4;
    if(activeFilter==='fr')        return tags.includes('fr');
    if(activeFilter==='intl')      return tags.includes('intl');
    if(activeFilter==='cocktail')  return mo.includes('cocktail')||mo.includes('diner');
    return tags.includes(activeFilter);
  });
}

function sorted(arr) {
  return [...arr].sort((a,b)=>{
    const sa=sc(a[2],a[3],a[4],a[5]),sb=sc(b[2],b[3],b[4],b[5]);
    if(sortKey==='score') {
      if(sa===0&&sb>0) return 1;
      if(sb===0&&sa>0) return -1;
      return sb-sa;
    }
    if(sortKey==='radio')   return (a[2]||999)-(b[2]||999);
    if(sortKey==='singles') return (a[3]||999)-(b[3]||999);
    if(sortKey==='shazam')  return (a[4]||999)-(b[4]||999);
    if(sortKey==='tiktok')  return (a[5]||999)-(b[5]||999);
    if(sortKey==='public')  return (b[11]||0)-(a[11]||0);
    if(sortKey==='year') return (a[7]||0)-(b[7]||0);
    if(sortKey==='artist') return (a[1]||'').localeCompare(b[1]||'');
    if(sortKey==='note') {
      var na = notes[trackKey(a)] ? 1 : 0;
      var nb2 = notes[trackKey(b)] ? 1 : 0;
      return nb2 - na;
    }
    return 0;
  });
}

// ══════════════════════════════════════════
// RENDER HELPERS
// ══════════════════════════════════════════
function rv(v,c) {
  if(!v) return '<span style="font-family:\'JetBrains Mono\',monospace;font-size:11px;color:var(--muted2)">—</span>';
  return '<span style="font-family:\'JetBrains Mono\',monospace;font-size:11px;color:'+c+'">#'+v+'</span>';
}
function trendHtml(t) {
  if(t>3)  return '<span style="color:var(--teal);font-size:9px"> ▲'+t+'</span>';
  if(t>0)  return '<span style="color:var(--teal);font-size:9px"> ▲</span>';
  if(t<-3) return '<span style="color:var(--red);font-size:9px"> ▼'+Math.abs(t)+'</span>';
  if(t<0)  return '<span style="color:var(--red);font-size:9px"> ▼</span>';
  return '';
}

// SPOTIFY PKCE + WEB PLAYBACK SDK
// ══════════════════════════════════════════
var SP_CLIENT_ID = '6a0b352e6eef416081cf01bddb253212';
var SP_REDIRECT  = 'https://replay04.github.io/dj-board/callback';
var spToken      = null;
var spCache      = {};
var spPlayer     = null;
var spReady      = false;
var spDeviceId   = null;
var seekTimer    = null;

// ── PKCE AUTH ──
async function generatePKCE() {
  var array = new Uint8Array(32);
  crypto.getRandomValues(array);
  var verifier = btoa(String.fromCharCode.apply(null, array))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  var encoder = new TextEncoder();
  var data = encoder.encode(verifier);
  var digest = await crypto.subtle.digest('SHA-256', data);
  var challenge = btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  return {verifier: verifier, challenge: challenge};
}

async function spLogin() {
  var pkce = await generatePKCE();
  localStorage.setItem('sp_verifier', pkce.verifier);
  var url = 'https://accounts.spotify.com/authorize'
    + '?client_id=' + SP_CLIENT_ID
    + '&response_type=code'
    + '&redirect_uri=' + encodeURIComponent(SP_REDIRECT)
    + '&scope=' + encodeURIComponent('streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state playlist-modify-private playlist-modify-public')
    + '&code_challenge_method=S256'
    + '&code_challenge=' + pkce.challenge
    + '&show_dialog=false';
  window.location.href = url;
}

function spLogout() {
  spToken = null;
  spReady = false;
  spPlayer = null;
  localStorage.removeItem('sp_token');
  localStorage.removeItem('sp_token_exp');
  localStorage.removeItem('sp_refresh');
  $('sp-login-btn').style.display = 'flex';
  $('sp-user').style.display = 'none';
}

async function spExchangeCode(code) {
  var verifier = localStorage.getItem('sp_verifier');
  if (!verifier) return false;
  try {
    var r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'grant_type=authorization_code'
        + '&code=' + code
        + '&redirect_uri=' + encodeURIComponent(SP_REDIRECT)
        + '&client_id=' + SP_CLIENT_ID
        + '&code_verifier=' + verifier
    });
    var data = await r.json();
    if (data.access_token) {
      spToken = data.access_token;
      localStorage.setItem('sp_token', data.access_token);
      localStorage.setItem('sp_token_exp', Date.now() + data.expires_in * 1000);
      if (data.refresh_token) localStorage.setItem('sp_refresh', data.refresh_token);
      localStorage.removeItem('sp_verifier');
      window.history.replaceState({}, '', window.location.pathname);
      spShowConnected();
      initSpSDK();
      return true;
    }
  } catch(e) { console.log('Token exchange error:', e); }
  return false;
}

async function spRefreshToken() {
  var refresh = localStorage.getItem('sp_refresh');
  if (!refresh) return false;
  try {
    var r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'grant_type=refresh_token'
        + '&refresh_token=' + refresh
        + '&client_id=' + SP_CLIENT_ID
    });
    var data = await r.json();
    if (data.access_token) {
      spToken = data.access_token;
      localStorage.setItem('sp_token', data.access_token);
      localStorage.setItem('sp_token_exp', Date.now() + data.expires_in * 1000);
      if (data.refresh_token) localStorage.setItem('sp_refresh', data.refresh_token);
      return true;
    }
  } catch(e) {}
  return false;
}

function spShowConnected() {
  $('sp-login-btn').style.display = 'none';
  $('sp-user').style.display = 'block';
}

async function spLoadToken() {
  // Check for auth code in URL
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  if (code) {
    return await spExchangeCode(code);
  }
  // Check stored token
  var token = localStorage.getItem('sp_token');
  var exp   = parseInt(localStorage.getItem('sp_token_exp') || '0');
  if (token && Date.now() < exp - 60000) {
    spToken = token;
    spShowConnected();
    initSpSDK();
    return true;
  }
  // Try refresh
  if (localStorage.getItem('sp_refresh')) {
    var ok = await spRefreshToken();
    if (ok) { spShowConnected(); initSpSDK(); return true; }
  }
  return false;
}

// ── WEB PLAYBACK SDK ──
function initSpSDK() {
  if (!spToken) return;
  if (document.getElementById('sp-sdk')) { setupPlayer(); return; }
  window.onSpotifyWebPlaybackSDKReady = setupPlayer;
  var s = document.createElement('script');
  s.id = 'sp-sdk';
  s.src = 'https://sdk.scdn.co/spotify-player.js';
  document.head.appendChild(s);
}

function setupPlayer() {
  if (!window.Spotify || !spToken) return;
  spPlayer = new Spotify.Player({
    name: 'DJ Board — PADJ.fr',
    getOAuthToken: function(cb) {
      // Check token freshness
      var exp = parseInt(localStorage.getItem('sp_token_exp') || '0');
      if (Date.now() < exp - 60000) { cb(spToken); return; }
      spRefreshToken().then(function(ok) { if (ok) cb(spToken); });
    },
    volume: 0.8
  });

  spPlayer.addListener('ready', function(data) {
    spDeviceId = data.device_id;
    spReady = true;
    console.log('Spotify SDK ready, device:', data.device_id);
  });

  spPlayer.addListener('not_ready', function() {
    spReady = false;
  });

  spPlayer.addListener('player_state_changed', function(state) {
    if (!state) return;
    updatePB(state);
  });

  spPlayer.addListener('authentication_error', function() {
    spLogout();
  });

  spPlayer.connect();
}

function updatePB(state) {
  if (!state) return;
  var track = state.track_window && state.track_window.current_track;
  if (!track) return;
  var artistName = track.artists.map(function(a){return a.name}).join(', ');
  $('pb-t').textContent = track.name;
  $('pb-a').textContent = artistName;
  var art = track.album && track.album.images && track.album.images[track.album.images.length-1];
  if (art) $('pb-art').src = art.url;
  $('pb-pp').textContent = state.paused ? '▶' : '⏸';
  // Update MediaSession for CarPlay/keyboard
  navigator.mediaSession.playbackState = state.paused ? 'paused' : 'playing';
  updateMediaSession(track.name, artistName, art ? art.url : '', state.duration);
  var dur = state.duration || 1;
  var pos = state.position || 0;
  $('pb-dur').textContent = fmtT(dur/1000);
  $('pb-el').textContent  = fmtT(pos/1000);
  $('pb-seek').value = (pos/dur)*100;
  $('player-bar').classList.add('on');
  clearInterval(seekTimer);
  if (!state.paused) {
    seekTimer = setInterval(function() {
      if (!spPlayer) return;
      spPlayer.getCurrentState().then(function(s) {
        if (!s || s.paused) { clearInterval(seekTimer); return; }
        var p = s.position, d2 = s.duration || 1;
        $('pb-el').textContent = fmtT(p/1000);
        $('pb-seek').value = (p/d2)*100;
        if (p >= d2 - 800) { clearInterval(seekTimer); pNext(); }
      });
    }, 1000);
  }
}

// ── SEARCH ──
async function spSearch(title, artist) {
  var k = title + '|' + artist;
  if (spCache[k]) return spCache[k];
  if (!spToken) return null;
  try {
    var q = encodeURIComponent(title + ' ' + artist.split('&')[0].split('feat')[0].trim());
    var r = await fetch('https://api.spotify.com/v1/search?q=' + q + '&type=track&limit=3&market=FR', {
      headers: {'Authorization': 'Bearer ' + spToken}
    });
    if (r.status === 401) {
      var ok = await spRefreshToken();
      if (!ok) { spLogout(); return null; }
      r = await fetch('https://api.spotify.com/v1/search?q=' + q + '&type=track&limit=3&market=FR', {
        headers: {'Authorization': 'Bearer ' + spToken}
      });
    }
    var data = await r.json();
    var id = data.tracks && data.tracks.items && data.tracks.items.length > 0
      ? data.tracks.items[0].uri : null;
    if (id) spCache[k] = id;
    return id;
  } catch(e) { return null; }
}

// ── PLAYER CONTROLS ──
async function pLoad(yt, title, artist, d) {
  playingYt = yt;
  $('pb-t').textContent = title;
  $('pb-a').textContent = '⏳...';
  $('player-bar').classList.add('on');
  qIdx = queue.findIndex(function(x) { return x[10] === yt; });

  // Update row buttons
  document.querySelectorAll('.play-btn,.card-play').forEach(function(b) {
    b.classList.remove('on');
    b.textContent = b.classList.contains('play-btn') ? '▶' : '▶ Écouter';
  });
  var rows = document.querySelectorAll('#tbody tr');
  if (qIdx >= 0 && rows[qIdx]) {
    var pb = rows[qIdx].querySelector('.play-btn');
    if (pb) { pb.textContent = '⏸'; pb.classList.add('on'); playingBtn = pb; }
  }

  if (!spToken) {
    $('pb-a').textContent = artist + ' — connecte Spotify ↑';
    return;
  }

  if (!spReady) {
    $('pb-a').textContent = '⏳ Initialisation Spotify...';
    // Wait for player to be ready
    var waited = 0;
    while (!spReady && waited < 10000) {
      await new Promise(function(r){setTimeout(r, 500)});
      waited += 500;
    }
    if (!spReady) { $('pb-a').textContent = 'Spotify non prêt. Recharge la page.'; return; }
  }

  var uri = await spSearch(title, artist);
  if (!uri) { $('pb-a').textContent = artist + ' (non trouvé sur Spotify)'; return; }

  try {
    await fetch('https://api.spotify.com/v1/me/player/play?device_id=' + spDeviceId, {
      method: 'PUT',
      headers: {'Authorization': 'Bearer ' + spToken, 'Content-Type': 'application/json'},
      body: JSON.stringify({uris: [uri]})
    });
    $('pb-a').textContent = artist;
  } catch(e) {
    $('pb-a').textContent = 'Erreur lecture: ' + e.message;
  }
}

function pToggle() {
  if (!spPlayer) return;
  spPlayer.getCurrentState().then(function(state) {
    if (!state) return;
    if (state.paused) {
      spPlayer.resume();
    } else {
      spPlayer.pause();
    }
  });
}

function pStop() {
  if (spPlayer) spPlayer.pause();
  clearInterval(seekTimer);
  $('player-bar').classList.remove('on');
  $('pb-art').src = '';
  playingYt = null;
  if (playingBtn) { playingBtn.textContent = '▶'; playingBtn.classList.remove('on'); playingBtn = null; }
  render();
}

function pNext() {
  if (playAllActive && qIdx >= queue.length - 1) {
    playAllActive = false;
    var btn = $('btn-play-all');
    if (btn) { btn.textContent = '▶ Tout écouter'; btn.classList.remove('playing'); }
    pStop(); return;
  }
  qIdx = Math.min(queue.length - 1, qIdx + 1);
  var nd = queue[qIdx];
  pLoad(nd[10], nd[0], nd[1], nd);
}

function pPrev() {
  if (spPlayer) {
    spPlayer.getCurrentState().then(function(s) {
      if (s && s.position > 3000) { spPlayer.seek(0); return; }
      qIdx = Math.max(0, qIdx - 1);
      var pd = queue[qIdx];
      pLoad(pd[10], pd[0], pd[1], pd);
    });
  } else {
    qIdx = Math.max(0, qIdx - 1);
    var pd = queue[qIdx];
    pLoad(pd[10], pd[0], pd[1], pd);
  }
}

function pSeek(v) {
  if (spPlayer) {
    spPlayer.getCurrentState().then(function(s) {
      if (s) spPlayer.seek(s.duration * v / 100);
    });
  }
}

function pVol(v) {
  if (spPlayer) spPlayer.setVolume(parseInt(v) / 100);
}

function saveLiked() {
  localStorage.setItem('sp_liked', JSON.stringify(spLiked));
}

async function getOrCreatePlaylist() {
  if (spPlaylistId) return spPlaylistId;
  if (!spToken) return null;
  try {
    // Get user ID
    var me = await fetch('https://api.spotify.com/v1/me', {
      headers: {'Authorization': 'Bearer ' + spToken}
    });
    var meData = await me.json();
    var userId = meData.id;

    // Create playlist
    var r = await fetch('https://api.spotify.com/v1/users/' + userId + '/playlists', {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + spToken, 'Content-Type': 'application/json'},
      body: JSON.stringify({
        name: '❤️ DJ Board Favoris',
        description: 'Titres aimés depuis DJ Board — PADJ.fr',
        public: false
      })
    });
    var data = await r.json();
    if (data.id) {
      spPlaylistId = data.id;
      localStorage.setItem('sp_playlist_id', data.id);
      return data.id;
    }
  } catch(e) { console.log('Playlist error:', e); }
  return null;
}

async function spToggleLike(yt, title, artist, btn) {
  if (!spToken) {
    alert('Connecte-toi à Spotify pour sauvegarder des favoris.');
    return;
  }

  var wasLiked = spLiked[yt] || false;

  if (wasLiked) {
    // Unlike — remove from playlist
    delete spLiked[yt];
    saveLiked();
    btn.textContent = '🤍';
    btn.classList.remove('liked');
    btn.title = 'Ajouter aux favoris Spotify';

    // Remove from Spotify playlist
    var plId = await getOrCreatePlaylist();
    if (plId && spLiked[yt + '_uri']) {
      await fetch('https://api.spotify.com/v1/playlists/' + plId + '/tracks', {
        method: 'DELETE',
        headers: {'Authorization': 'Bearer ' + spToken, 'Content-Type': 'application/json'},
        body: JSON.stringify({tracks: [{uri: spLiked[yt + '_uri']}]})
      }).catch(function(){});
    }
  } else {
    // Like — add to playlist
    btn.textContent = '⏳';

    // Search Spotify for URI
    var uri = await spSearch(title, artist);
    if (!uri) {
      btn.textContent = '🤍';
      alert('Titre non trouvé sur Spotify.');
      return;
    }

    spLiked[yt] = true;
    spLiked[yt + '_uri'] = uri;
    saveLiked();
    btn.textContent = '❤️';
    btn.classList.add('liked');
    btn.title = 'Retirer des favoris Spotify';

    // Add to Spotify playlist
    var plId = await getOrCreatePlaylist();
    if (plId) {
      await fetch('https://api.spotify.com/v1/playlists/' + plId + '/tracks', {
        method: 'POST',
        headers: {'Authorization': 'Bearer ' + spToken, 'Content-Type': 'application/json'},
        body: JSON.stringify({uris: [uri]})
      }).catch(function(){});
    }
  }
}

  el.innerHTML=ks.map(function(k){
    var n=notes[k],parts=k.split('|'),t=parts[0],a=parts[1];
    return '<div class="note-item"><div class="ni-title">'+t+'</div><div class="ni-artist">'+a+'</div><div class="ni-status">'+n.st+(n.tx?' — '+n.tx:'')+'</div><button class="ni-edit" onclick="openModal(\''+k+'\',\''+t+'\')">Modifier</button></div>';
  }).join('');
}

// ══════════════════════════════════════════
// SETLIST
// ══════════════════════════════════════════
window.lastSetlist=[];
function genSetlist(){
  var dur=parseFloat($('cfg-dur').value);
  var age=$('cfg-age').value,type=$('cfg-type').value,style=$('cfg-style').value;
  var pool=[].concat(T);
  if(style==='fr') pool=pool.filter(function(d){return d[6].includes('fr')});
  if(style==='intl') pool=pool.filter(function(d){return d[6].includes('intl')});
  if(age==='senior') pool=pool.filter(function(d){return d[11]>=4});
  if(age==='mixed') pool=pool.filter(function(d){return d[11]>=2});
  pool.sort(function(a,b){return sc(b[2],b[3],b[4],b[5])-sc(a[2],a[3],a[4],a[5])});
  var struct=[];
  if(type==='mariage'){
    if(dur>=3) struct.push({phase:'🥂 Cocktail',mo:['cocktail','diner'],n:6});
    if(dur>=4) struct.push({phase:'🍽 Dîner',mo:['diner','cocktail'],n:8});
    struct.push({phase:'🕺 Dancefloor',mo:['dance'],n:Math.round(dur*3)});
    struct.push({phase:'❤️ Slows & Finale',mo:['slow','fin'],n:4});
  } else if(type==='cocktail'){
    struct.push({phase:'🥂 Cocktail',mo:['cocktail','diner'],n:Math.round(dur*5)});
  } else {
    struct.push({phase:'🎵 Intro',mo:['cocktail','diner'],n:4});
    struct.push({phase:'🕺 Dancefloor',mo:['dance'],n:Math.round(dur*4)});
    struct.push({phase:'🎉 Finale',mo:['fin','dance'],n:3});
  }
  var used=new Set();var result=[];
  struct.forEach(function(ph){
    var avail=pool.filter(function(d){return d[13].some(function(m){return ph.mo.includes(m)})&&!used.has(trackKey(d))});
    var picked=avail.slice(0,ph.n);
    picked.forEach(function(d){used.add(trackKey(d))});
    result.push(Object.assign({},ph,{tracks:picked}));
  });
  window.lastSetlist=[];
  result.forEach(function(ph){(ph.tracks||[]).forEach(function(d){window.lastSetlist.push(d)})});
  var html='<div class="sl-hdr"><div class="sl-title">SETLIST '+dur+'H</div><div class="sl-meta">'+(age==='young'?'Jeune':age==='senior'?'Senior':'Mixte')+' · '+type+' · '+(style==='all'?'Éclectique':style)+'</div></div>';
  result.forEach(function(ph){
    if(!ph.tracks||!ph.tracks.length) return;
    html+='<div class="sl-phase">'+ph.phase+'</div>';
    ph.tracks.forEach(function(d,i){
      var next=ph.tracks[i+1];
      var g=gr(sc(d[2],d[3],d[4],d[5]));
      html+='<div class="sl-track"><div class="sl-n">'+(i+1)+'</div><div class="sl-info"><div class="sl-name">'+d[0]+'</div><div class="sl-artist">'+d[1]+'</div><div class="sl-tags"><span class="cam" style="font-size:9px">'+d[12]+'</span><span style="font-family:\'JetBrains Mono\',monospace;font-size:9px;color:var(--muted)">'+d[7]+' BPM</span><span class="grade g'+g+'" style="font-size:10px;padding:1px 5px">'+g+'</span></div></div><button class="btn-sl-yt" onclick="pLoad(\''+d[10]+'\',\''+d[0].replace(/'/g,"\\'")+'\',\''+d[1].replace(/'/g,"\\'")+'\')">▶</button></div>';
      if(next){
        var trans=d[12]===next[12]?'✓ Même ton.':Math.abs(parseInt(d[12])-parseInt(next[12]))<=1?'≈ Proches':'↕ Libre';
        html+='<div class="sl-trans">'+trans+' · '+d[7]+'→'+next[7]+' BPM</div>';
      }
    });
  });
  $('setlist-out').innerHTML=html;
  $('setlist-out').classList.add('show');
  $('export-row').classList.add('show');
}

// ══════════════════════════════════════════
// PERF MODE
// ══════════════════════════════════════════
var perfTracks=[],perfIdx=0;
var PM={cocktail:'🥂 Cocktail',diner:'🍽 Dîner',dance:'🕺 Dancefloor',slow:'❤️ Slow',fin:'🎉 Finale'};

function initPerf(){
  if(!window.lastSetlist||!window.lastSetlist.length){
    $('perf-empty').style.display='';$('perf-wrap').style.display='none';return;
  }
  perfTracks=window.lastSetlist;
  $('perf-empty').style.display='none';$('perf-wrap').style.display='block';
  perfIdx=0;perfRender();
}
function perfRender(){
  var d=perfTracks[perfIdx],nx=perfTracks[perfIdx+1];
  $('perf-title').textContent=d[0];$('perf-artist').textContent=d[1];
  $('perf-cam').textContent=d[12];$('perf-bpm').textContent=d[7]+' BPM';
  $('perf-mo').textContent=d[13].map(function(m){return PM[m]||m}).join(' · ');
  if(nx){
    $('pnb-title').textContent=nx[0];$('pnb-artist').textContent=nx[1];
    $('pnb-cam').textContent=nx[12];
    var t=d[12]===nx[12]?'✓ Même ton.':Math.abs(parseInt(d[12])-parseInt(nx[12]))<=1?'≈ Proches':'↕ Libre';
    $('pnb-trans').textContent=t+' · '+d[7]+'→'+nx[7]+' BPM';
    $('perf-next-bar').style.display='flex';
  } else $('perf-next-bar').style.display='none';
  $('pnav-prev').style.opacity=perfIdx===0?'0.3':'1';
  $('pnav-next').textContent=perfIdx>=perfTracks.length-1?'FIN ✓':'SUIV. ▶';
  $('perf-list').innerHTML=perfTracks.map(function(t,i){
    return '<div class="perf-li '+(i===perfIdx?'on':'')+'" onclick="perfIdx='+i+';perfRender()"><span class="pli-n '+(i===perfIdx?'on':'')+'">'+( i+1)+'</span><div><div class="pli-title">'+t[0]+'</div><div class="pli-artist">'+t[1]+'</div></div><span class="pli-cam">'+t[12]+'</span></div>';
  }).join('');
  var child=$('perf-list').children[perfIdx];
  if(child) child.scrollIntoView({block:'nearest'});
}
function perfNav(dir){perfIdx=Math.max(0,Math.min(perfTracks.length-1,perfIdx+dir));perfRender()}
function perfYT(){var d=perfTracks[perfIdx];if(d) pLoad(d[10],d[0],d[1],d)}

loadData();

// ── MEDIA KEYS (clavier, CarPlay, télécommande) ──
navigator.mediaSession.setActionHandler('play', function() {
  if (spPlayer) spPlayer.resume();
});
navigator.mediaSession.setActionHandler('pause', function() {
  if (spPlayer) spPlayer.pause();
});
navigator.mediaSession.setActionHandler('previoustrack', function() {
  pPrev();
});
navigator.mediaSession.setActionHandler('nexttrack', function() {
  pNext();
});
navigator.mediaSession.setActionHandler('seekto', function(details) {
  if (spPlayer && details.seekTime) {
    spPlayer.seek(details.seekTime * 1000);
  }
});

function updateMediaSession(title, artist, artUrl, duration) {
  if (!navigator.mediaSession) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: title,
    artist: artist,
    artwork: artUrl ? [{src: artUrl, sizes: '96x96', type: 'image/jpeg'}] : []
  });
  if (duration) {
    try {
      navigator.mediaSession.setPositionState({
        duration: duration / 1000,
        playbackRate: 1,
        position: 0
      });
    } catch(e) {}
  }
}
