<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Connexion Spotify...</title>
<style>
  body { background: #07070e; color: #e8e8f5; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; flex-direction: column; gap: 16px; }
  .spinner { width: 32px; height: 32px; border: 3px solid #333; border-top-color: #1DB954; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 13px; color: #666; }
</style>
</head>
<body>
<div class="spinner"></div>
<p>Connexion Spotify en cours...</p>
<script>
  // Récupérer le token depuis le hash et le transmettre à la page principale
  const hash = window.location.hash.substring(1);
  if (hash) {
    const params = new URLSearchParams(hash);
    const token = params.get('access_token');
    const expiresIn = parseInt(params.get('expires_in') || '3600');
    if (token) {
      localStorage.setItem('sp_token', token);
      localStorage.setItem('sp_token_exp', Date.now() + expiresIn * 1000);
    }
  }
  // Rediriger vers la page principale
  window.location.href = '/dj-board/';
</script>
</body>
</html>
