<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Connexion Spotify...</title>
<style>
  body{background:#07070e;color:#e8e8f5;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column;gap:16px}
  .spinner{width:32px;height:32px;border:3px solid #333;border-top-color:#1DB954;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  p{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="spinner"></div>
<p id="msg">Connexion Spotify en cours...</p>
<script>
var params = new URLSearchParams(window.location.search);
var code = params.get('code');
var error = params.get('error');
if(error) {
  document.getElementById('msg').textContent = 'Erreur: ' + error;
} else if(code) {
  document.getElementById('msg').textContent = 'Connexion réussie, redirection...';
  window.location.href = 'https://replay04.github.io/dj-board/dj-popularity.html?code=' + encodeURIComponent(code) + (params.get('state') ? '&state=' + encodeURIComponent(params.get('state')) : '');
} else {
  document.getElementById('msg').textContent = 'Aucun code reçu.';
}
</script>
</body>
</html>
